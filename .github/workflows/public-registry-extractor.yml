name: Public Registry Extractor

on:
  push:
    branches:
      - research/registry-extractor-2026-11-07
    paths:
      - tools/public_registry_extractor/**
      - .github/workflows/public-registry-extractor.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-registry-extractor
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install extractor dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb>=1.2.0 pandas requests pyarrow

      - name: Extract FAA and Norwegian registry tables
        run: python -u tools/public_registry_extractor/extract.py

      - name: Commit generated CSV tables to the research branch
        if: always()
        run: |
          if [ -d exports/public-registry ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add exports/public-registry/
            if ! git diff --cached --quiet; then
              git commit -m "data(registry): publish filtered source extracts"
              git push origin HEAD:${{ github.ref_name }}
            fi
          fi

      - name: Upload CSV and audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-registry-extract-${{ github.run_number }}
          path: exports/public-registry/
          if-no-files-found: warn
          retention-days: 14
